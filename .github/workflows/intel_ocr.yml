name: Intel OCR (scanned reports)
on:
  workflow_dispatch:
    inputs:
      shards:
        default: "16"
      kinds:
        description: "annual or quarterly (comma list, prefix match)"
        default: "quarterly"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - id: m
        run: echo "m=$(python3 -c "print(list(range(int('${{ github.event.inputs.shards }}'))))")" >> $GITHUB_OUTPUT
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        b: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: pip install -q requests
      - name: OCR shard
        env:
          ONLY_OCR: "1"
          OCR_KINDS: ${{ github.event.inputs.kinds }}
          OCR_DPI: "200"
          OCR_MAXPAGES: "24"
          SHARD: ${{ matrix.b }}
        run: |
          SYMS=$(python3 intel/ocr_list.py ${{ matrix.b }} ${{ github.event.inputs.shards }})
          echo "shard ${{ matrix.b }}: $SYMS"
          [ -z "$SYMS" ] && exit 0
          python intel/fetch_reports_pilot.py "$SYMS" --annual 5 --quarterly 8
          python intel/extract_statements.py "$SYMS"
          for s in ${SYMS//,/ }; do rm -rf state/intel_raw/reports_text/$s; done
      - name: Commit
        run: |
          git config user.name "psx-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -- state/intel_raw/reports_text/index.json 2>/dev/null || true
          git add state/intel_extract state/intel_raw/reports_index
          git commit -m "Intel OCR shard ${{ matrix.b }}" || echo "nothing new"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break || { git rebase --abort 2>/dev/null; sleep $((RANDOM % 20 + 10)); }; done
