name: Intel prices (DPS end-of-day history)
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "comma list"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - run: python intel/fetch_prices.py "${{ github.event.inputs.symbols }}"
      - name: Commit
        run: |
          git config user.name "psx-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/intel_prices; git commit -m "Intel prices" || echo none
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break || sleep $((RANDOM % 20 + 10)); done
