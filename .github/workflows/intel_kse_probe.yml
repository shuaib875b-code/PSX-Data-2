name: intel-kse-probe
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          D=state/intel_debug/kse2; mkdir -p $D
          H='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0'
          for u in downloads daily-downloads dataportal/daily-downloads timeseries/eod/ENGRO timeseries/eod/KSE100 market-summary; do
            n=$(echo $u | tr '/' '_')
            curl -s -m 40 -H "$H" -o $D/$n -w "$u %{http_code} %{size_download}\n" "https://dps.psx.com.pk/$u" | tee -a $D/log.txt
            grep -o 'href="[^"]*"' $D/$n 2>/dev/null | grep -i "download\|index\|indices\|\.zip\|\.csv\|\.xls\|\.Z\|history" | sort -u | head -40 >> $D/links_$n.txt || true
          done
          git config user.name bot; git config user.email bot@x; git add $D
          git commit -qm "kse probe 2" && git pull -q --rebase && git push -q
