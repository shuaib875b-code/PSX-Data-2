name: Intel rollout (reports -> statements)
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Comma list of company classes"
        default: "operating"
      first:
        description: "First batch number"
        default: "1"
      batches:
        description: "Last batch number (exclusive)"
        default: "14"
      dps_only:
        description: "1 = only newer reports from DPS announcements not yet fetched"
        default: "0"
permissions:
  contents: write
concurrency:
  group: intel-rollout-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - id: m
        run: echo "m=$(python3 -c "print(list(range(int('${{ github.event.inputs.first }}'), int('${{ github.event.inputs.batches }}'))))")" >> $GITHUB_OUTPUT
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        b: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: pip install -q requests
      - name: Process batch
        env:
          NO_OCR: "1"
          DPS_ONLY: ${{ github.event.inputs.dps_only }}
          CLASSES: ${{ github.event.inputs.classes }}
        run: |
          SYMS=$(python3 intel/rollout_list.py $(( ${{ matrix.b }} * 25 )) 25)
          echo "batch ${{ matrix.b }}: $SYMS"
          [ -z "$SYMS" ] && exit 0
          python intel/fetch_reports_pilot.py "$SYMS" --annual 5 --quarterly 8
          python intel/extract_statements.py "$SYMS"
          python intel/extract_qualitative.py "$SYMS" || true
          for s in ${SYMS//,/ }; do rm -rf state/intel_raw/reports_text/$s; done
      - name: Commit
        env:
          CLASSES: ${{ github.event.inputs.classes }}
        run: |
          git config user.name "psx-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p state/intel_raw/reports_index
          python3 - <<'PY'
          import json, subprocess
          idx = json.load(open("state/intel_raw/reports_text/index.json"))
          syms = subprocess.run(["python3", "intel/rollout_list.py", str(${{ matrix.b }} * 25), "25"], capture_output=True, text=True).stdout.strip().split(",")
          json.dump({s: idx[s] for s in syms if s in idx}, open("state/intel_raw/reports_index/batch_${{ github.event.inputs.dps_only }}_${{ github.event.inputs.classes }}_${{ matrix.b }}.json", "w"), separators=(",", ":"))
          PY
          git checkout -- state/intel_raw/reports_text/index.json 2>/dev/null || true
          git add state/intel_extract state/intel_qual state/intel_raw/reports_index
          git commit -m "Intel rollout batch ${{ matrix.b }}" || echo "nothing new"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || { git rebase --abort 2>/dev/null; sleep 15; }; done
